<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>اختبار صوت نجم</title>
<style>
  /* Najm-like chat: dark night sky, purple bubbles, one rounded composer pinned to the bottom. */
  :root {
    --bg: #110d26; --panel: #1b1736; --panel2: #262046; --line: #3b3468; --text: #f3f0ff; --muted: #a8a1cf;
    --user: #6b4fd4; --send: #d9774f; --ok: #3ccf91; --warn: #f2b84b; --bad: #ff7a7a; --bar: #c9b8ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif; }
  body { display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe38a, #f2b84b 45%, #7b5cf0 46%); flex: none; }
  header h1 { margin: 0; font-size: 18px; line-height: 1.3; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 16px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: 14px; color: var(--muted); }
  .bubble { align-self: flex-start; max-width: 86%; background: var(--user); color: #fff; padding: 10px 14px; border-radius: 20px 20px 6px 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble small { display: block; opacity: .8; font-size: 12px; }
  .bubble .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .bubble img { max-width: 160px; max-height: 160px; border-radius: 12px; display: block; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 4px 8px; font-size: 13px; max-width: 100%; }
  .composer-wrap { padding-block: 8px calc(10px + env(safe-area-inset-bottom)); }
  .composer { background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; }
  .att { position: relative; display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px 4px 26px; font-size: 13px; max-width: 100%; }
  .att img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
  .att button { position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: #0006; color: #fff; font-size: 13px; line-height: 20px; padding: 0; }
  textarea { width: 100%; min-height: 44px; max-height: 38dvh; resize: none; background: transparent; border: 0; color: var(--text); font: inherit; outline: none; padding: 4px 6px; }
  .bar { direction: ltr; display: flex; align-items: center; gap: 8px; min-height: 48px; }
  .btn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--panel2); color: var(--text); flex: none; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }
  .btn:disabled { opacity: .4; }
  .btn.send { background: var(--send); color: #fff; }
  .btn svg { width: 22px; height: 22px; }
  .spacer { flex: 1; }
  .wave { flex: 1; height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 3px; overflow: hidden; }
  .wave i { width: 4px; height: 4px; border-radius: 2px; background: var(--bar); opacity: .55; }
  .timer { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 40px; text-align: center; }
  .menu { direction: rtl; display: flex; gap: 8px; flex-wrap: wrap; }
  .menu button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 14px; padding: 8px 12px; font: inherit; font-size: 14px; min-height: 44px; }
  .status { font-size: 13px; min-height: 18px; padding-inline: 6px; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.bad { color: var(--bad); }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 13px; color: var(--muted); padding-inline: 6px; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font: inherit; font-size: 13px; }
  details { font-size: 12px; color: var(--muted); padding-inline: 6px; }
  details pre { white-space: pre-wrap; direction: ltr; text-align: left; margin: 6px 0; }
  @media (prefers-reduced-motion: reduce) { .wave i { transition: none; } }
</style>
</head>
<body>
  <header>
    <div class="avatar" aria-hidden="true"></div>
    <div><h1>نجم</h1><p>تجربة الصوت والمرفقات لمحادثة المشرف</p></div>
  </header>

  <main class="log" id="log" aria-live="polite">
    <div class="note">صفحة تجربة فقط: لا تحفظ شيئا ولا ترسله لأي مكان. «إرسال» يضع رسالتك هنا فقط. تحويل الكلام في هذه الصفحة يتم بمحرك جهازك، وفي الموقع سيكون بمحرك نجم (Gemini).</div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <div class="attachments" id="attachments"></div>
      <textarea id="text" rows="1" placeholder="اكتب رسالتك هنا…" aria-label="نص الرسالة"></textarea>
      <div class="menu" id="menu" hidden>
        <button type="button" id="pickImage">🖼️ صورة</button>
        <button type="button" id="pickFile">📄 ملف (PDF وغيره)</button>
      </div>
      <div class="bar" id="idleBar">
        <button class="btn" id="plus" type="button" aria-label="إضافة صورة أو ملف" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="spacer"></span>
        <button class="btn" id="mic" type="button" aria-label="ابدأ التسجيل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="btn send" id="send" type="button" aria-label="إرسال">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
      <div class="bar" id="recBar" hidden>
        <button class="btn" id="cancel" type="button" aria-label="إلغاء هذا التسجيل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="wave" id="wave" aria-hidden="true"></div>
        <span class="timer" id="timer">0:00</span>
        <button class="btn" id="stop" type="button" aria-label="إيقاف التسجيل ومراجعة النص">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
        <button class="btn send" id="sendRec" type="button" aria-label="إيقاف وإرسال">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="autosend"> أرسل تلقائيًا عند الإيقاف</label>
      <label>اللهجة
        <select id="lang">
          <option value="ar-SA">العربية (السعودية)</option>
          <option value="ar-KW">العربية (الكويت)</option>
          <option value="ar-AE">العربية (الإمارات)</option>
          <option value="ar-EG">العربية (مصر)</option>
          <option value="en-US">English (US)</option>
        </select>
      </label>
    </div>
    <details><summary>معلومات الفحص</summary><pre id="diag"></pre></details>
    <input type="file" id="imageInput" accept="image/*" multiple hidden>
    <input type="file" id="fileInput" accept=".pdf,application/pdf,image/*,.txt,.csv,.doc,.docx,.xls,.xlsx" multiple hidden>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const text = $("text"), statusEl = $("status"), log = $("log"), wave = $("wave"), timer = $("timer");
  const idleBar = $("idleBar"), recBar = $("recBar"), menu = $("menu"), plus = $("plus"), micBtn = $("mic");
  const autoSend = $("autosend"), langSel = $("lang"), attachmentsEl = $("attachments");
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const events = [], attachments = [];
  const BARS = 26; for (let i = 0; i < BARS; i++) wave.appendChild(document.createElement("i"));
  const bars = [...wave.children];

  const note = (kind, message) => { statusEl.className = "status " + (kind || ""); statusEl.textContent = message; };
  function trace(line) { events.push(new Date().toISOString().slice(11, 19) + " " + line); if (events.length > 80) events.shift(); diag(); }
  function diag() {
    $("diag").textContent = ["speechRecognition: " + (Recognition ? "available" : "NOT available"), "homeScreenApp: " + standalone,
      "language: " + langSel.value, "userAgent: " + navigator.userAgent, "", ...events].join("\n");
  }
  const ERRORS = {
    "not-allowed": "لم يُسمح باستخدام المايك. اسمح لـ Safari بالمايك من الإعدادات ثم أعد المحاولة.",
    "service-not-allowed": "خدمة الإملاء غير متاحة هنا. شغّل «الإملاء» من إعدادات لوحة المفاتيح، أو جرّب من Safari.",
    "audio-capture": "المايك مشغول. انتظر ثانية ثم اضغط المايك مرة أخرى.",
    "network": "تعذر الاتصال بخدمة التعرف على الكلام. تحقق من الإنترنت.",
    "language-not-supported": "هذه اللهجة غير مدعومة على هذا الجهاز. جرّب لهجة أخرى.",
  };

  // Draft kept on this device so a call, a reload or closing the page never loses the message.
  const DRAFT = "kawkab-voice-draft";
  const saveDraft = () => { try { localStorage.setItem(DRAFT, text.value); } catch {} };
  const grow = () => { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, innerHeight * 0.38) + "px"; };
  const micLabel = () => micBtn.setAttribute("aria-label", text.value.trim() ? "أكمل التسجيل" : "ابدأ التسجيل");

  // One microphone owner: the dictation itself. The pulse follows speech and results, so nothing else opens the mic.
  let energy = 0, speaking = false, raf = 0, startedAt = 0;
  function animate() {
    energy *= 0.9;
    const t = performance.now() / 110, floor = speaking ? 0.12 : 0.02;
    bars.forEach((bar, i) => {
      const v = Math.max(floor, energy) * (0.55 + 0.45 * Math.sin(t + i * 0.8));
      bar.style.height = (4 + v * 34).toFixed(1) + "px"; bar.style.opacity = v > 0.08 ? 1 : 0.55;
    });
    const s = Math.floor((Date.now() - startedAt) / 1000); timer.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    raf = requestAnimationFrame(animate);
  }

  // Recognition. iOS ends a session after a pause; it restarts until stopped. Each session is numbered so a late
  // end of an old session never touches a new one.
  let rec = null, listening = false, before = "", committed = "", interim = "", gen = 0, restarts = 0, lastStart = 0, stopping = null;
  const join = (...parts) => parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
  const render = () => { text.value = join(before, committed, interim); grow(); text.scrollTop = text.scrollHeight; saveDraft(); };

  function open(sessionGen) {
    const r = new Recognition();
    r.lang = langSel.value; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    let sessionText = "";
    r.onstart = () => { if (sessionGen !== gen) return; lastStart = Date.now(); trace("start #" + restarts); note("ok", "يستمع… تكلم الآن."); };
    r.onspeechstart = () => { if (sessionGen === gen) { speaking = true; energy = Math.max(energy, 0.6); } };
    r.onspeechend = () => { if (sessionGen === gen) speaking = false; };
    r.onresult = e => {
      if (sessionGen !== gen) return;
      let all = ""; for (let i = 0; i < e.results.length; i++) all += e.results[i][0].transcript + " ";
      sessionText = all.trim(); interim = sessionText; energy = Math.min(1, energy + 0.4); render();
    };
    r.onerror = e => {
      if (sessionGen !== gen) return;
      trace("error: " + e.error);
      if (e.error === "no-speech" || e.error === "aborted") return;
      listening = false; note("bad", ERRORS[e.error] || ("خطأ: " + e.error));
    };
    r.onend = () => {
      if (sessionGen !== gen) return;
      trace("end");
      committed = join(committed, interim || sessionText); interim = ""; render();
      if (listening && restarts < 60 && Date.now() - lastStart > 400) {
        restarts++;
        try { rec = open(gen); rec.start(); return; } catch (err) { trace("restart failed: " + err.name); }
      }
      finish();
    };
    return r;
  }

  function start() {
    if (!Recognition) { note("bad", "هذا المتصفح لا يدعم تحويل الكلام إلى نص. على iPhone استخدم Safari."); return; }
    if (rec) { try { rec.abort(); } catch {} rec = null; }
    gen++; before = text.value.trim(); committed = ""; interim = ""; restarts = 0; listening = true; stopping = null;
    menu.hidden = true; plus.setAttribute("aria-expanded", "false");
    idleBar.hidden = true; recBar.hidden = false; text.readOnly = true;
    startedAt = Date.now(); energy = 0; speaking = false; cancelAnimationFrame(raf); animate();
    try { rec = open(gen); rec.start(); }
    catch (err) { trace("start failed: " + err.name); listening = false; finish(); note("bad", "تعذر بدء التسجيل. انتظر ثانية وجرّب مرة أخرى."); }
  }
  function stop(mode) {
    stopping = mode; listening = false;
    if (!rec) return finish();
    try { mode === "cancel" ? rec.abort() : rec.stop(); } catch { finish(); return; }
    // If the engine never reports its end (seen on some devices), close the session ourselves.
    const pending = gen; setTimeout(() => { if (pending === gen && rec) { trace("end timeout"); committed = join(committed, interim); interim = ""; render(); finish(); } }, 2500);
  }
  function finish() {
    cancelAnimationFrame(raf); raf = 0; speaking = false;
    const mode = stopping; stopping = null;
    if (rec) { const r = rec; rec = null; r.onend = r.onresult = r.onerror = null; try { r.abort(); } catch {} }
    gen++;
    idleBar.hidden = false; recBar.hidden = true; text.readOnly = false; grow();
    if (mode === "cancel") { text.value = before; saveDraft(); grow(); note("", "أُلغي آخر تسجيل، وبقي النص الذي قبله."); }
    else if (mode === "pause") note("warn", "توقف التسجيل بسبب مقاطعة. نصك محفوظ؛ اضغط المايك لتكمل.");
    else if ((mode === "send" || (mode === "stop" && autoSend.checked)) && (text.value.trim() || attachments.length)) send();
    else if (statusEl.className.indexOf("bad") === -1) note("", text.value.trim() ? "راجع النص وعدّله، ثم أرسل، أو اضغط المايك لتكمل." : "");
    micLabel();
  }

  // Attachments: preview only on this page. In the site, Najm reads images and PDFs.
  function addFiles(list) {
    for (const file of list) {
      if (attachments.length >= 5) { note("warn", "خمسة مرفقات كحد أقصى في الرسالة."); break; }
      const item = { file, url: file.type.startsWith("image/") ? URL.createObjectURL(file) : null };
      attachments.push(item);
    }
    renderAttachments();
  }
  function renderAttachments() {
    attachmentsEl.replaceChildren(...attachments.map((item, i) => {
      const el = document.createElement("div"); el.className = "att";
      if (item.url) { const img = document.createElement("img"); img.src = item.url; img.alt = item.file.name; el.append(img); }
      const name = document.createElement("span"); name.textContent = item.file.name + " · " + Math.max(1, Math.round(item.file.size / 1024)) + " ك.ب"; el.append(name);
      const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "إزالة " + item.file.name);
      x.onclick = () => { if (item.url) URL.revokeObjectURL(item.url); attachments.splice(i, 1); renderAttachments(); };
      el.append(x); return el;
    }));
  }

  function send() {
    const value = text.value.trim(); if (!value && !attachments.length) return;
    const bubble = document.createElement("div"); bubble.className = "bubble";
    if (value) bubble.append(document.createTextNode(value));
    if (attachments.length) {
      const files = document.createElement("div"); files.className = "files";
      for (const item of attachments.splice(0)) {
        if (item.url) { const img = document.createElement("img"); img.src = item.url; img.alt = item.file.name; files.append(img); }
        else { const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = "📄 " + item.file.name; files.append(chip); }
      }
      bubble.append(files); renderAttachments();
    }
    const meta = document.createElement("small"); meta.textContent = "رسالة تجريبية — لم تُرسل لأي مكان"; bubble.append(meta);
    log.append(bubble); log.scrollTop = log.scrollHeight;
    text.value = ""; saveDraft(); grow(); micLabel(); note("ok", "أُرسلت الرسالة (تجريبيًا)."); trace("sent " + value.length + " chars");
  }

  micBtn.onclick = start;
  $("stop").onclick = () => stop("stop");
  $("cancel").onclick = () => stop("cancel");
  $("sendRec").onclick = () => stop("send");
  $("send").onclick = send;
  plus.onclick = () => { menu.hidden = !menu.hidden; plus.setAttribute("aria-expanded", String(!menu.hidden)); };
  $("pickImage").onclick = () => $("imageInput").click();
  $("pickFile").onclick = () => $("fileInput").click();
  $("imageInput").onchange = e => { addFiles(e.target.files); e.target.value = ""; menu.hidden = true; };
  $("fileInput").onchange = e => { addFiles(e.target.files); e.target.value = ""; menu.hidden = true; };
  text.addEventListener("input", () => { saveDraft(); grow(); micLabel(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && listening) stop("pause"); });
  langSel.onchange = diag;
  try { const d = localStorage.getItem(DRAFT); if (d) { text.value = d; note("", "استرجعنا نصك المحفوظ؛ أكمل التسجيل أو أرسله."); } } catch {}
  grow(); micLabel(); diag();
  if (!Recognition) note("warn", "هذا المتصفح لا يدعم تحويل الكلام إلى نص هنا. على iPhone استخدم Safari.");
})();
</script>
</body>
</html>
